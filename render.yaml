# Render Blueprint Specification
# Deploy at https://dashboard.render.com/blueprints

services:
  - type: web
    name: mazhar-in
    env: static
    buildCommand: python build.py
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
